# TIER 2 - APP: FastAPI backend + Next.js frontend, on the data tier's network.
# The api reaches Jaeger and Langfuse by name when the observability tier is up; when it isn't,
# spans and LLM traces are dropped without an error.

name: p2-recommender

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        API_PORT: ${API_PORT:-2011}
    container_name: p2-api
    env_file:
      - ../../.env
    environment:
      # In-network URLs override the host-side ones in .env.
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      LANGFUSE_HOST: http://langfuse-web:3000
      API_PORT: ${API_PORT:-2011}
    ports:
      - "127.0.0.1:${API_PORT:-2011}:${API_PORT:-2011}"
    depends_on:
      - qdrant
      - redis
      - dynamodb

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        # Public values baked into the browser bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:2011}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk}
        NEXT_PUBLIC_DEV_TOKEN: ${NEXT_PUBLIC_DEV_TOKEN:-}
        WEB_PORT: ${WEB_PORT:-2012}
    container_name: p2-web
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_dummy}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk}
      WEB_PORT: ${WEB_PORT:-2012}
    ports:
      - "127.0.0.1:${WEB_PORT:-2012}:${WEB_PORT:-2012}"
    depends_on:
      - api
