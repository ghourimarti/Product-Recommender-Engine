# TIER 1 - DATA: Qdrant (catalog vectors), DynamoDB-local (chat history), Redis (cache,
# rate limits, SerpApi budget). All three compose files share `name: p2-recommender`: one
# project, one network, services reach each other by name.
# Host ports are bound to 127.0.0.1 only: nothing is reachable from the LAN.

name: p2-recommender

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: p2-qdrant
    environment:
      # Set = Qdrant enforces it (the api sends it); empty = no auth locally.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-2001}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-2002}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    container_name: p2-dynamodb
    # In-memory: chat history is practice data and resets with the container.
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"
    ports:
      - "127.0.0.1:${DYNAMODB_PORT:-2003}:8000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: p2-redis
    # AOF on a volume: a cold cache would re-spend real (metered) SerpApi searches.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-2004}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  qdrant_data:
  redis_data:
