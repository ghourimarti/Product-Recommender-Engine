# ─────────────────────────────────────────────────────────────────────────────
# TIER 1 — DATA  (start first)
#
# Everything the API/eval scripts read from or write to: vector DB, chat history,
# cache. Named volumes are declared here so `make downv` sees them.
#
# Same `name:` as the other two compose files → all tiers share ONE docker
# project + network. Bring them up in any order; api reaches jaeger and vice
# versa by container name.
# ─────────────────────────────────────────────────────────────────────────────

name: p2-recommender

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: p2-qdrant
    environment:
      # Enforce QDRANT_API_KEY when one is set. Previously the client SENT an api key while the
      # server required none, so the setting was a no-op that only produced "api key used with an
      # insecure connection" warnings. Leave QDRANT_API_KEY empty locally for no auth.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "${QDRANT_HTTP_PORT:-2001}:6333"  # HTTP/REST
      - "${QDRANT_GRPC_PORT:-2002}:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    container_name: p2-dynamodb
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"
    ports:
      - "${DYNAMODB_PORT:-2003}:8000"

  redis:
    image: redis:7.4-alpine
    container_name: p2-redis
    # Persist the cache. Without a volume every restart wiped Redis, so the aggregate cache was
    # cold again and the next queries re-spent REAL SerpApi searches (metered, 250/month).
    # AOF gives durability without a heavy config.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-2004}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  qdrant_data:
  redis_data:
