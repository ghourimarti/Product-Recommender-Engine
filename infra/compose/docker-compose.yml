name: p2-recommender

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: p2-qdrant
    ports:
      - "6333:6333"  # REST/HTTP
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    container_name: p2-dynamodb
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"
    ports:
      - "8000:8000"

  redis:
    image: redis:7.4-alpine
    container_name: p2-redis
    ports:
      - "6379:6379"

volumes:
  qdrant_data:
