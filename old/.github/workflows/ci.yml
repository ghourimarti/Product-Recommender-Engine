name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install ruff bandit pip-audit
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: SAST (bandit)
        working-directory: backend
        run: bandit -r app -ll
      - name: Dependency audit (pip-audit)
        working-directory: backend
        run: pip-audit -r requirements.txt || true   # report; don't block on transitive advisories
      - name: Tests
        working-directory: backend
        env:
          QDRANT_URL: http://localhost:6333
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install + typecheck + build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run typecheck
          npm run build

  rag-eval-gate:
    # Quality gate: RAGAS must clear thresholds before merge (Decision 19).
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install
        run: |
          pip install -r backend/requirements.txt -r eval/requirements-eval.txt
      - name: Validate eval dataset
        run: python eval/run_eval.py --dry-run
      - name: RAGAS eval (gated)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
        run: python eval/run_eval.py   # exits non-zero if thresholds regress
