[project]
name = "product-recommender-backend"
version = "0.1.0"
description = "Production-grade RAG product recommender (enterprise transformation of the Flipkart demo)"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
