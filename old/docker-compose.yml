# Full local stack (Decision 15). Bring up: `docker compose up --build`.
# Apply DB migrations once: `docker compose run --rm backend alembic upgrade head`.
# Ingest corpus: `docker compose run --rm backend python -m scripts.ingest`.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recommender
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  embedding:
    build: ./embedding-service
    environment:
      EMBEDDING_MODEL: BAAI/bge-base-en-v1.5
      EMBEDDING_DIM: "768"
    ports: ["8001:8001"]

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/recommender
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      VECTOR_BACKEND: qdrant
      EMBEDDING_PROVIDER: service
      EMBEDDING_SERVICE_URL: http://embedding:8001
      AUTH_ENABLED: "false"          # local dev; prod uses Cognito (D9)
      OTEL_ENABLED: "false"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }
      embedding: { condition: service_started }

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./infra/monitoring:/etc/prometheus:ro"]   # prometheus.yml + alerts.yml
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  qdrant_data:
  pg_data:
