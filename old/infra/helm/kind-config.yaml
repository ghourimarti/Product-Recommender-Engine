# Local kind cluster (Decision 15). Create: kind create cluster --config infra/helm/kind-config.yaml
# Then: helm install rec infra/helm/recommender -f infra/helm/recommender/values.yaml \
#         --set localDeps.enabled=true --set ingress.enabled=false
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080, protocol: TCP }
  - role: worker
  - role: worker
