apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "recommender.name" . }}-frontend
  labels: {{- include "recommender.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { app: recommender-frontend }
  template:
    metadata:
      labels: { app: recommender-frontend }
    spec:
      containers:
        - name: frontend
          image: {{ include "recommender.image" (dict "img" .Values.frontend.image "tag" .Values.frontend.tag "Values" .Values) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: {{ .Values.frontend.port }} }]
          readinessProbe:
            httpGet: { path: /, port: {{ .Values.frontend.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "recommender.name" . }}-frontend
spec:
  selector: { app: recommender-frontend }
  ports: [{ port: {{ .Values.frontend.port }}, targetPort: {{ .Values.frontend.port }} }]
