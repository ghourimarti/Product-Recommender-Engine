{{- if .Values.secrets.createSecret }}
# Local/dev convenience only. In prod, External Secrets Operator syncs AWS Secrets Manager
# into a Secret named {{ .Values.secrets.externalSecretName }} (D17). Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.externalSecretName }}
  labels: {{- include "recommender.labels" . | nindent 4 }}
type: Opaque
stringData:
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | default "" | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default "" | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | default "" | quote }}
{{- end }}
