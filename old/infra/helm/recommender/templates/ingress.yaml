{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "recommender.name" . }}
  labels: {{- include "recommender.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"   # required for SSE streaming (D8)
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "recommender.name" . }}-backend
                port: { number: {{ .Values.backend.port }} }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "recommender.name" . }}-frontend
                port: { number: {{ .Values.frontend.port }} }
{{- end }}
