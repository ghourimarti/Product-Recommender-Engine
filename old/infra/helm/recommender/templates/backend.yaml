apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "recommender.name" . }}-backend
  labels: {{- include "recommender.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels: { app: recommender-backend }
  template:
    metadata:
      labels: { app: recommender-backend }
    spec:
      containers:
        - name: backend
          image: {{ include "recommender.image" (dict "img" .Values.backend.image "tag" .Values.backend.tag "Values" .Values) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: {{ .Values.backend.port }} }]
          envFrom:
            - configMapRef: { name: {{ include "recommender.name" . }}-config }
            {{- if or .Values.secrets.createSecret .Values.secrets.externalSecretName }}
            - secretRef: { name: {{ .Values.secrets.externalSecretName }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: {{ .Values.backend.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.backend.port }} }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "recommender.name" . }}-backend
spec:
  selector: { app: recommender-backend }
  ports: [{ port: {{ .Values.backend.port }}, targetPort: {{ .Values.backend.port }} }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "recommender.name" . }}-backend
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: recommender-backend }
{{- if .Values.backend.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "recommender.name" . }}-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "recommender.name" . }}-backend
  minReplicas: {{ .Values.backend.hpa.minReplicas }}
  maxReplicas: {{ .Values.backend.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.hpa.targetCPUUtilizationPercentage }}
{{- end }}
