# Helm values (Decision 15). Override per-env with -f values-<env>.yaml.
nameOverride: recommender

image:
  registry: ""            # e.g. <acct>.dkr.ecr.us-east-1.amazonaws.com
  pullPolicy: IfNotPresent

backend:
  image: recommender-backend
  tag: latest
  replicas: 3
  port: 8000
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

frontend:
  image: recommender-frontend
  tag: latest
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

embedding:
  image: recommender-embedding
  tag: latest
  replicas: 2
  port: 8001
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2", memory: "2Gi" }

# Non-secret config surfaced as a ConfigMap.
config:
  ENVIRONMENT: prod
  VECTOR_BACKEND: qdrant
  EMBEDDING_PROVIDER: service
  EMBEDDING_SERVICE_URL: http://recommender-embedding:8001
  QDRANT_URL: http://qdrant:6333
  AUTH_ENABLED: "true"
  OTEL_ENABLED: "true"

# Secrets: in prod use External Secrets Operator (D17). For a quick local install you may
# set createSecret=true and provide values, but DO NOT commit real secrets.
secrets:
  createSecret: false
  externalSecretName: recommender-secrets   # referenced via envFrom when ESO-managed

ingress:
  enabled: true
  className: nginx
  host: recommender.example.com

networkPolicy:
  enabled: true

# Lightweight in-cluster data deps for local kind only. In prod use RDS/ElastiCache/Qdrant.
localDeps:
  enabled: false
