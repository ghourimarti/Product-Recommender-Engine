name: RAG Quality Evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/rag/**"
      - "backend/app/core/guardrails.py"
      - "backend/tests/evaluation/**"

jobs:
  evaluate:
    name: RAGAS Evaluation (faithfulness + relevancy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore ChromaDB from cache (if available)
        uses: actions/cache@v4
        with:
          path: backend/chroma_db
          key: chroma-db-${{ hashFiles('data/anime_updated.csv') }}

      - name: Build vector store (if cache miss)
        env:
          SECRET_KEY: "eval-key-not-used-for-vector-build"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ ! -d "chroma_db" ] || [ -z "$(ls -A chroma_db 2>/dev/null)" ]; then
            echo "Building vector store from CSV..."
            python ../scripts/build_vector_store.py --csv ../data/anime_updated.csv
          else
            echo "Using cached vector store."
          fi

      - name: Run RAGAS evaluation
        id: ragas
        env:
          SECRET_KEY: "eval-key-for-ci-minimum-32-chars!!"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m tests.evaluation.eval_ragas

      - name: Comment evaluation result on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.ragas.outcome }}';
            const icon = outcome === 'success' ? '✅' : '❌';
            const body = `## ${icon} RAG Evaluation Results\n\n` +
              `**Status:** ${outcome === 'success' ? 'PASSED' : 'FAILED'}\n\n` +
              `Metrics evaluated: \`faithfulness\` ≥ 0.65, \`answer_relevancy\` ≥ 0.65\n\n` +
              `See the [Actions log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for detailed scores.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
