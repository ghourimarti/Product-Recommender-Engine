name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Type Check & Unit/Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Type check with mypy
        run: mypy app/ --ignore-missing-imports

      - name: Run unit tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-secret-key-for-ci-only-minimum-32-chars!!' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'gsk_test_placeholder' }}
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-secret-key-for-ci-only-minimum-32-chars!!' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'gsk_test_placeholder' }}
        run: pytest tests/integration/ -v --tb=short

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          dockerfile: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/anime-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/anime-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          dockerfile: frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/anime-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/anime-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
