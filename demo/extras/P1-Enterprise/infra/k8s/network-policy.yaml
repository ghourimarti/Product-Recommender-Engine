---
# Frontend can only reach the backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress
  namespace: anime-recommender
spec:
  podSelector:
    matchLabels:
      app: anime-frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: anime-backend
      ports:
        - protocol: TCP
          port: 8000
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53

---
# Backend accepts traffic only from frontend and Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
  namespace: anime-recommender
spec:
  podSelector:
    matchLabels:
      app: anime-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: anime-frontend
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8000
