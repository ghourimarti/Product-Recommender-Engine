apiVersion: apps/v1
kind: Deployment
metadata:
  name: anime-backend
  namespace: anime-recommender
  labels:
    app: anime-backend
    version: v2.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anime-backend
  template:
    metadata:
      labels:
        app: anime-backend
      annotations:
        # Prometheus auto-discovery
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: YOUR_REGISTRY/anime-backend:v2.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: anime-config
            - secretRef:
                name: anime-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 10
          volumeMounts:
            - name: chroma-storage
              mountPath: /app/chroma_db
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: chroma-storage
          persistentVolumeClaim:
            claimName: chroma-pvc
        - name: logs
          emptyDir: {}
      terminationGracePeriodSeconds: 30
