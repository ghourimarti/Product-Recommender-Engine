[project]
name = "p2-recommender"
version = "0.1.0"
description = "Conversational, rating-aware product recommender (Enterprise2)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-qdrant>=0.2",
    "langchain-groq>=0.2",
    "langchain-anthropic>=0.2",
    "qdrant-client>=1.12,<1.13",  # pinned to match the v1.12.4 server image
    "fastembed>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "boto3>=1.35",
    "prometheus-client>=0.20",
    "redis>=5.0",
    "pyjwt[crypto]>=2.9",
]
# NOTE: RAGAS was the Decision-19 choice but every ragas release hard-imports
# langchain_community.chat_models.vertexai (removed in langchain-community for
# langchain-core>=0.3, which our LLM stack requires) -> unresolvable conflict.
# Step 7 uses an equivalent custom LLM-judge harness (same metrics) instead.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Monorepo: each packages/<name> is installed editable as a top-level import.
[tool.hatch.build.targets.wheel]
packages = [
    "packages/core",
    "packages/retrieval",
    "packages/recommender",
    "packages/evaluation",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fakeredis>=2.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps", "tests"]
# Reference/archive/source-doc dirs are not part of this build and must not be linted.
extend-exclude = ["demo", "old", "Prompts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["packages", "apps"]

[tool.pytest.ini_options]
pythonpath = ["packages", "apps"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires external services (Qdrant) and API keys",
]
filterwarnings = [
    # Local Qdrant runs over http; this warning is expected in dev (prod uses https).
    "ignore:Api key is used with an insecure connection.:UserWarning",
]

# Third-party libs without complete type stubs — keep our own code strict.
[[tool.mypy.overrides]]
module = [
    "langchain_core.*",
    "langchain_openai.*",
    "langchain_qdrant.*",
    "langchain_groq.*",
    "langchain_anthropic.*",
    "qdrant_client.*",
    "fastembed.*",
    "boto3.*",
    "botocore.*",
    "redis.*",
    "fakeredis.*",
    "jwt.*",
]
ignore_missing_imports = true
