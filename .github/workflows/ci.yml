name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (pins Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Lint + format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy packages apps tests
      - name: Unit tests
        run: uv run pytest -q -m "not integration"
      - name: Dependency vulnerability audit
        run: uv run --with pip-audit pip-audit
      - name: Code security scan
        run: uv run --with bandit bandit -r packages apps -q

  image-scan:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t p2-api:ci .
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: p2-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  integration:
    runs-on: ubuntu-latest
    needs: lint-type-test
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports: ["8000:8000"]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Index catalog into Qdrant
        run: uv run python -m retrieval.index
      - name: Integration tests (auto-skip if no OPENAI_API_KEY secret)
        run: uv run pytest -q -m integration

  eval-gate:
    runs-on: ubuntu-latest
    needs: integration
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Ranking eval gate (blocks merge on regression vs baseline)
        run: uv run python -m evaluation.ranking.gate
