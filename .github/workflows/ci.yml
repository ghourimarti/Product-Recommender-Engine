name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    # Lint + types + offline unit tests + the ranking-quality eval gate.
    # No external services, no API keys, no paid SerpApi calls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync (Python 3.12 + deps)
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy packages apps tests
      - name: Unit tests (offline)
        run: uv run pytest -q -m "not integration"

      # Quality gate for the SHIPPED /aggregate ranking path. Reads recorded SerpApi
      # fixtures, so it needs no services and no API keys and spends no paid quota —
      # which is why it can block every PR. Two guards: NDCG@3/MRR must stay within
      # tolerance of the frozen baseline, AND our ordering must still beat Google
      # Shopping's own result order. If the second fails, the re-ranker has stopped
      # earning its place and the build should go red rather than ship it.
      #
      # The static-catalog gate (`evaluation.ranking.gate`) is NOT run here: it needs a
      # seeded Qdrant plus OPENAI_API_KEY for embeddings. Run it locally via
      # `make eval-gate`.
      - name: Eval gate (ranking regression)
        run: uv run python -m evaluation.aggregator.gate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Example Clerk key so static prerender of Clerk pages succeeds in CI.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
        run: node node_modules/next/dist/bin/next build

  integration:
    # Real local services via GitHub service containers. Tests that also need API keys
    # (LLM / SerpApi) auto-skip unless the secrets are configured — so this never spends
    # paid SerpApi quota, while tests needing only local services (e.g. DynamoDB history
    # isolation) still run.
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports: ["8000:8000"]
    env:
      QDRANT_URL: http://localhost:6333
      REDIS_URL: redis://localhost:6379/0
      DYNAMODB_ENDPOINT: http://localhost:8000
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync --frozen
      - name: Integration tests (key-gated tests auto-skip)
        run: uv run pytest -q -m integration
