apiVersion: v2
name: p2-recommender
description: Conversational, rating-aware product recommender (api + web + qdrant + redis)
type: application
# 0.2.0: standard selector labels, per-environment values overlays, required immutable image tags.
# 0.3.0: restricted Pod Security profile, probes, PDBs, topology spread, Redis as a StatefulSet
#        with AOF on a PVC, Qdrant API key enforced, headless governing Services.
# 0.4.0: Gateway API HTTPRoute (same-origin /api) replaces the Ingress; dynamodb-local for kind;
#        DYNAMODB_ENDPOINT derived per environment; post-install seed Job; NetworkPolicies.
# 0.5.0: no service-link env vars in any pod (the "web" Service's WEB_PORT=tcp://... moved Next.js
#        to port 3000 on the first kind install); web's WEB_PORT is set from web.port.
# 0.6.0: monitoring (ServiceMonitor, PrometheusRule, Grafana dashboards) from files/, shared with
#        compose; ApiDown also fires with zero replicas; pod templates drop the chart/app version
#        labels, so a chart bump no longer restarts every pod.
# 0.7.0: the seed Job is idempotent (--skip-if-current: re-indexes only when the catalog changed),
#        so it runs after upgrades too and on every Argo CD sync without blanking the catalog.
version: 0.7.0
appVersion: "0.1.0"
