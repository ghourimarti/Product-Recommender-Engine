apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "p2.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "p2.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.api.port }}
      targetPort: http
