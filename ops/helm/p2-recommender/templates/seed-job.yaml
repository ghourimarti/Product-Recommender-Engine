{{- if .Values.seed.enabled }}
{{- /* Indexes the product catalog into Qdrant: the in-cluster `make seed`. It runs once, after the
first install. The indexer recreates the collection, so re-running it on every upgrade would
briefly empty the catalog mid-rollout. Re-seed deliberately with --set seed.onUpgrade=true. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  labels:
    {{- include "p2.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed
  annotations:
    helm.sh/hook: {{ ternary "post-install,post-upgrade" "post-install" .Values.seed.onUpgrade }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6 # Qdrant may still be starting; retries back off 10 s, 20 s, 40 s, ...
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600 # a failed Job stays around for an hour, for debugging
  template:
    metadata:
      labels:
        {{- include "p2.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false # services are found through DNS (see web-deployment.yaml)
      securityContext:
        {{- include "p2.podSecurityContext" .Values.api.securityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: seed
          image: {{ include "p2.image" (dict "image" .Values.api.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "retrieval.index"]
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          env:
            - name: QDRANT_URL
              value: {{ .Values.api.env.QDRANT_URL | quote }}
          resources:
            {{- toYaml .Values.seed.resources | nindent 12 }}
          securityContext:
            {{- include "p2.containerSecurityContext" .Values.api.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp # fastembed downloads its BM25 model here
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
{{- end }}
