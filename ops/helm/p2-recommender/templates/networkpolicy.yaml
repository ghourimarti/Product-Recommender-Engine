{{- if .Values.networkPolicy.enabled }}
{{- /* Default-deny ingress for every pod in the release, then one allow per real traffic path.
kindnet enforces these (proven in step 6A); kubelet health probes come from the node and aren't
affected. Egress stays open: the api and the seed Job call OpenAI, Groq, Anthropic, SerpApi, Clerk
and Hugging Face. The web pod never calls the api directly: the browser reaches it through the
Gateway (same-origin /api). */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "p2.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "p2.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-gateway
  labels:
    {{- include "p2.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "p2.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
      ports:
        - port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-gateway-and-monitoring
  labels:
    {{- include "p2.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "p2.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
        {{- with .Values.networkPolicy.monitoringNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-from-api-and-seed
  labels:
    {{- include "p2.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "p2.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: qdrant
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "p2.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              {{- include "p2.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: seed
      ports:
        - port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-api
  labels:
    {{- include "p2.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "p2.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "p2.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - port: redis
{{- if .Values.dynamodbLocal.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dynamodb-from-api
  labels:
    {{- include "p2.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "p2.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dynamodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "p2.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - port: http
{{- end }}
{{- end }}
