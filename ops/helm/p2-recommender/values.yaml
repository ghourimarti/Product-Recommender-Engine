# Common values for every environment. Per-environment overlays sit beside this file:
#   values-kind.yaml (Phase 6) · values-doks.yaml (Phase 7) · values-eks.yaml (Phase 8)
#
#   helm upgrade --install p2 ops/helm/p2-recommender -n p2 --create-namespace \
#     -f ops/helm/p2-recommender/values-<env>.yaml \
#     --set-string image.tag=$(git rev-parse --short HEAD)
#
# Resource names are fixed (api, web, qdrant, redis), so in-cluster URLs don't depend on the
# release name. The trade-off is one release per namespace.
#
# Every pod runs the "restricted" Pod Security profile: non-root (numeric UIDs below), no
# privilege escalation, all capabilities dropped, seccomp RuntimeDefault, read-only root
# filesystem with emptyDirs or PVCs exactly where each image writes. Each setting was checked by
# running the real image that way in Docker (2026-10-06).

# The chart doesn't create secrets. It expects a Secret with this name to already exist in the
# namespace. The api and the seed Job load all of it (envFrom); web reads only CLERK_SECRET_KEY;
# Qdrant reads only QDRANT_API_KEY. How the Secret gets there is per environment:
#   kind: a make target builds it from a filtered .env (Phase 6)
#   DOKS: decided in Phase 7 (SOPS or the External Secrets Operator)
#   EKS:  External Secrets Operator + AWS Secrets Manager (Phase 8; not built yet)
secretName: p2-secrets

# Images we build (api, web). One shared tag, because both are built from the same commit.
image:
  # Empty = local images loaded into the nodes (kind).
  # DOKS: registry.digitalocean.com/<name> · EKS: <account>.dkr.ecr.<region>.amazonaws.com
  registry: ""
  # REQUIRED: an immutable git SHA. Empty and "latest" fail the render. Pass it with
  # --set-string, because plain --set turns an all-digit SHA (e.g. 1234567) into a number.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: [] # e.g. [{name: docr-pull}] for a private registry

# Zero-downtime rollouts: a terminating api/web pod keeps serving this long, while its endpoint
# removal propagates to every node and the Gateway.
preStopSleepSeconds: 5

# Spread api/web replicas across nodes. Soft (ScheduleAnyway), so a one-node cluster still works.
topologySpread:
  enabled: true

# PodDisruptionBudgets for api and web: drains and upgrades take at most this many at a time.
pdb:
  enabled: true
  maxUnavailable: 1

api:
  image:
    repository: p2-api
    tag: "" # optional override; empty = image.tag
  replicas: 2 # only used when autoscaling is disabled (otherwise the HPA owns it)
  # Matches the container's EXPOSE (env-driven: see apps/api/Dockerfile + .env).
  # If you change API_PORT in .env, update this to match.
  port: 2011
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    # Cluster-internal URLs use Service names on their INTERNAL ports
    # (the Qdrant image speaks 6333 and Redis 6379; those don't change).
    # DYNAMODB_ENDPOINT isn't listed here: the template derives it from dynamodbLocal.enabled.
    QDRANT_URL: http://qdrant:6333
    REDIS_URL: redis://redis:6379/0
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    API_PORT: "2011"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  # A hardened api container took 28 s to report healthy (measured 2026-10-06). 5 s x 36 gives
  # 180 s of headroom for a slow start on a busy node before liveness can restart it.
  startupProbe:
    failureThreshold: 36
  terminationGracePeriodSeconds: 30 # must exceed preStopSleepSeconds + uvicorn's drain time
  securityContext:
    runAsUser: 10001 # the image's appuser. Numeric on purpose: the image sets USER by name.
    runAsGroup: 10001
    readOnlyRootFilesystem: true # scratch writes go to an emptyDir at /tmp; models are baked in
  serviceAccount:
    create: true
    name: p2-api
    annotations: {} # EKS: the IRSA role ARN goes here (values-eks.yaml, Phase 8)

web:
  image:
    repository: p2-web
    tag: "" # optional override; empty = image.tag
  replicas: 2
  # Matches the container's EXPOSE (env-driven: see apps/web/Dockerfile + .env).
  port: 2012
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: 10001 # the image's webuser (USER is set by name in the image)
    runAsGroup: 10001
    readOnlyRootFilesystem: true # writes go to emptyDirs at /tmp and /app/.next/cache

# qdrant.port / redis.port are the ports the IMAGES speak inside the pod (Qdrant 6333,
# Redis 6379). They're the image contract, not host ports, so leave them on their well-known
# values. Host-side ports live in .env.
qdrant:
  image:
    repository: qdrant/qdrant
    tag: v1.12.4-unprivileged # runs as uid 1000; the plain v1.12.4 image runs as root
  port: 6333
  storage: 10Gi
  # Empty = the cluster's default StorageClass. Set it per environment. volumeClaimTemplates
  # can't be changed after the first install, so get this right before then.
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000 # makes the PVC writable on storage classes that honour fsGroup
    readOnlyRootFilesystem: true # data on the PVC; snapshots and /tmp on emptyDirs

redis:
  image:
    repository: redis
    tag: 7.4-alpine
  port: 6379
  storage: 1Gi
  storageClassName: "" # set per environment, like qdrant.storageClassName
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  securityContext:
    runAsUser: 999 # the image's redis account
    runAsGroup: 1000
    fsGroup: 1000
    readOnlyRootFilesystem: true # AOF and snapshots go to the PVC at /data

# North-south routing (Gateway API): one HTTPRoute, same-origin. /api/* goes to the api with the
# prefix stripped, everything else to web. The platform owns the Gateway (created in step 6E);
# the chart only attaches to it. This replaces the old ALB Ingress, which sent /api/* to FastAPI
# unstripped, so every API call would have returned 404.
gateway:
  enabled: true
  parentRefs:
    - name: public
      namespace: gateway
  hostnames: [] # empty = every hostname on the Gateway's listener; set per environment
  apiRequestTimeout: 120s # long enough for a streamed (SSE) answer to finish

# In-memory DynamoDB emulator, for kind practice only. Real environments use AWS DynamoDB.
dynamodbLocal:
  enabled: false
  image:
    repository: amazon/dynamodb-local
    tag: 2.5.2
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: 1000 # the image's dynamodblocal user (USER is set by name in the image)
    runAsGroup: 1000
    readOnlyRootFilesystem: true # needs a disk-backed /tmp; see the template

# Post-install Job that indexes the product catalog into Qdrant (the in-cluster `make seed`).
seed:
  enabled: true
  # Also run after upgrades. The Job skips unless the catalog changed, and the catalog ships in
  # the api image, so an upgrade that changes it gets re-indexed (see the template).
  onUpgrade: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Prometheus Operator objects for the app (step 6F): a ServiceMonitor for the api, the alert rules
# from files/alerts.yaml (PrometheusRule) and the dashboards from files/dashboards/ (a ConfigMap
# for the Grafana sidecar). Off by default because they need the operator's CRDs
# (kube-prometheus-stack); each environment turns them on.
monitoring:
  enabled: false
  jobName: p2-api # the job label compose uses too, so the rules and dashboards work unchanged
  scrapeInterval: 15s

# Default-deny ingress for every pod in the release, plus one allow per real traffic path.
networkPolicy:
  enabled: true
  gatewayNamespace: envoy-gateway-system # where Envoy Gateway runs its proxy pods (step 6E)
  monitoringNamespace: monitoring # Prometheus scrapes api /metrics from here (step 6F); "" = none
