# Secrets (DB creds, API keys) are synced into this k8s Secret by the External Secrets
# Operator from AWS Secrets Manager (Decision 17). The chart references it via envFrom.
secretName: p2-secrets

api:
  image:
    repository: p2-api
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    QDRANT_URL: http://qdrant:6333
    REDIS_URL: redis://redis:6379/0
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  serviceAccount:
    create: true
    name: p2-api
    annotations: {}  # prod: eks.amazonaws.com/role-arn: <IRSA role ARN> (DynamoDB/Secrets access)

web:
  image:
    repository: p2-web
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

qdrant:
  image:
    repository: qdrant/qdrant
    tag: v1.12.4
  port: 6333
  storage: 10Gi

redis:
  image:
    repository: redis
    tag: 7.4-alpine
  port: 6379

ingress:
  enabled: false
  className: alb
  host: recommender.example.com
