# Secrets (DB creds, API keys) are synced into this k8s Secret by the External Secrets
# Operator from AWS Secrets Manager (Decision 17). The chart references it via envFrom.
secretName: p2-secrets

api:
  image:
    repository: p2-api
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  # Matches the container's EXPOSE (env-driven — see apps/api/Dockerfile + .env).
  # If you change API_PORT in .env, update this to match.
  port: 2011
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    # Cluster-internal URLs use k8s Service names on their INTERNAL ports
    # (Qdrant image speaks 6333, Redis speaks 6379 — those don't change).
    QDRANT_URL: http://qdrant:6333
    REDIS_URL: redis://redis:6379/0
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    API_PORT: "2011"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  serviceAccount:
    create: true
    name: p2-api
    annotations: {}  # prod: eks.amazonaws.com/role-arn: <IRSA role ARN> (DynamoDB/Secrets access)

web:
  image:
    repository: p2-web
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  # Matches the container's EXPOSE (env-driven — see apps/web/Dockerfile + .env).
  port: 2012
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# NOTE: qdrant.port / redis.port are the ports the IMAGES speak inside the pod
# (Qdrant → 6333, Redis → 6379). These are the image contract, not host ports —
# leave them on their well-known values. Host-side ports live in .env.
qdrant:
  image:
    repository: qdrant/qdrant
    tag: v1.12.4
  port: 6333
  storage: 10Gi

redis:
  image:
    repository: redis
    tag: 7.4-alpine
  port: 6379

ingress:
  enabled: false
  className: alb
  host: recommender.example.com
