# DigitalOcean DOKS (Phase 7). Only settings that are decided now live here. Phase 7 adds:
#   image.registry:     registry.digitalocean.com/<registry-name>
#   image.pullSecrets:  the DOCR pull secret
#   gateway.hostnames:  ["app.<your-domain>"], plus TLS on the Gateway (cert-manager)
#   history store:      AWS DynamoDB with table-scoped IAM keys in the Secret (todo 7.0.5a)

api:
  autoscaling:
    maxReplicas: 6  # real nodes: scale-out is bounded by the node pool, not one Docker VM

qdrant:
  # DO block storage is network-attached, so the volume can follow the pod to another node.
  storageClassName: do-block-storage

redis:
  storageClassName: do-block-storage
