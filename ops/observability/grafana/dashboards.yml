# Grafana dashboard provider: the generated P2 dashboards land in the "P2" folder.
# ops/observability/grafana/build_dashboards.py writes them (v2 format: nested sections).
apiVersion: 1

providers:
  - name: p2
    orgId: 1
    folder: P2
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/compose
