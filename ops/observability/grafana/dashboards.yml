# Grafana dashboard provider: load every dashboard JSON from the mounted folder.
apiVersion: 1

providers:
  - name: p2
    orgId: 1
    folder: P2 Recommender
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
