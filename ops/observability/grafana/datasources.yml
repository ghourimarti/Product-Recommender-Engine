# Grafana datasources, provisioned so Grafana opens ready to query: nothing to add by hand.
# Fixed uids, so dashboards reference them by uid and survive a volume wipe.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # Request traces in Grafana: Explore > Jaeger, service p2-recommender.
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
